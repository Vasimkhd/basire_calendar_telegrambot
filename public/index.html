<!DOCTYPE html>
<html lang="__LANG__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Переговорные</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #3c4043;
      --muted: #70757a;
      --line: #dadce0;
      --hairline: #e8eaed;
      --blue: #1a73e8;
      --now: #ea4335;
      --hour: 72px;
      --gutter: 64px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      height: 100dvh;
      font-family: Arial, "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      flex: none;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding: 12px 20px 10px;
      border-bottom: 1px solid var(--line);
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    button {
      font: inherit;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
      height: 36px;
      cursor: pointer;
    }
    button:hover { background: #f8f9fa; }
    #today, .step { flex: none; }
    #today { padding: 0 16px; }
    .step {
      width: 36px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }
    #range {
      margin: 0 0 0 8px;
      font-size: 22px;
      font-weight: 400;
      white-space: nowrap;
    }
    .legend {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 16px;
    }
    .swatch {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--ink);
    }
    .swatch i {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      display: block;
    }
    .error {
      margin: 8px 0 0;
      color: #a50e0e;
      font-size: 13px;
    }
    #calendar {
      flex: 1;
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: auto;
    }
    .sheet { width: 100%; min-width: 760px; }
    .head, .body {
      display: grid;
      grid-template-columns: var(--gutter) repeat(7, minmax(96px, 1fr));
    }
    .head {
      position: sticky;
      top: 0;
      z-index: 4;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .corner, .gutter {
      position: sticky;
      left: 0;
      background: #fff;
    }
    .corner { grid-column: 1; z-index: 5; }
    .gutter { z-index: 2; }
    .day-head {
      text-align: center;
      padding: 8px 0 10px;
    }
    .dow {
      display: block;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      margin-top: 2px;
      border-radius: 50%;
      font-size: 24px;
    }
    .day-head.today .dow,
    .day-head.today .num { color: var(--blue); }
    .day-head.today .num { background: var(--blue); color: #fff; }
    .body { position: relative; }
    .tick { height: var(--hour); position: relative; }
    .tick span,
    .close-label {
      position: absolute;
      right: 8px;
      font-size: 10px;
      color: var(--muted);
    }
    .tick span { top: -6px; }
    .tick:first-child span { top: 2px; }
    .close-label { top: auto; bottom: -6px; }
    .day {
      position: relative;
      border-left: 1px solid var(--line);
    }
    .slot {
      height: var(--hour);
      border-bottom: 1px solid var(--line);
      position: relative;
    }
    .slot::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      border-top: 1px solid var(--hairline);
    }
    .event {
      position: absolute;
      z-index: 1;
      overflow: hidden;
      margin: 0;
      padding: 2px 6px;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 4px;
      text-align: left;
      line-height: 1.25;
      cursor: pointer;
      box-shadow: 0 1px 1px rgba(60, 64, 67, 0.18);
    }
    .event strong,
    .event span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .event strong { font-size: 12px; font-weight: 700; }
    .event span { display: none; font-size: 11px; }
    .event.long span { display: block; }
    .event:hover, .event.open {
      z-index: 2;
      box-shadow: 0 4px 12px rgba(60, 64, 67, 0.28);
    }
    .now {
      position: absolute;
      z-index: 3;
      left: var(--gutter);
      right: 0;
      height: 2px;
      background: var(--now);
      pointer-events: none;
    }
    .now::before {
      content: "";
      position: absolute;
      left: -5px;
      top: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--now);
    }
    .detail {
      position: fixed;
      z-index: 6;
      width: min(280px, calc(100vw - 24px));
      padding: 14px 16px 12px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(60, 64, 67, 0.28);
    }
    @media (max-width: 760px) {
      :root {
        --hour: 56px;
        --gutter: 40px;
      }
      header {
        padding: 10px 12px 8px;
        padding-top: max(10px, env(safe-area-inset-top));
      }
      .bar {
        flex-wrap: wrap;
        gap: 8px 12px;
      }
      h1 { font-size: 18px; }
      .controls { flex: 1 1 100%; gap: 6px; }
      #range {
        flex: 1;
        min-width: 0;
        margin-left: 2px;
        font-size: 16px;
      }
      .legend {
        flex: 1 1 100%;
        margin-left: 0;
        justify-content: flex-start;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      .swatch { max-width: 100%; }
      .swatch span { white-space: normal; }
      .strip {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        width: 100%;
        min-width: 0;
        position: sticky;
        top: 0;
        z-index: 5;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .chip {
        height: auto;
        width: 100%;
        min-width: 0;
        padding: 6px 0 8px;
        border: 0;
        border-radius: 0;
        background: transparent;
        overflow: hidden;
      }
      .chip .dow { font-size: 10px; letter-spacing: 0; }
      .chip .num { width: 28px; height: 28px; font-size: 15px; }
      .chip.today .dow,
      .chip.today .num { color: var(--blue); }
      .chip.selected .dow { color: var(--blue); }
      .chip.selected .num { background: var(--blue); color: #fff; }
      .head { display: none; }
      .sheet { min-width: 0; width: 100%; max-width: 100%; }
      .phone-board {
        display: flex;
        align-items: stretch;
        width: 100%;
        min-width: 0;
      }
      .phone-board .gutter {
        flex: none;
        width: var(--gutter);
      }
      .day-scroller {
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
        touch-action: pan-x;
      }
      .day-scroller::-webkit-scrollbar { display: none; }
      .day-track { display: flex; }
      .day-page {
        flex: none;
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }
      .day-page .day { border-left: 0; }
      .day-page .now { left: 0; right: 0; }
      .tick span, .close-label { right: 4px; font-size: 10px; }
      .event { padding: 4px 8px; }
      .detail {
        left: 12px;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        width: auto;
      }
    }
    .detail h3 {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 500;
    }
    .detail p { margin: 0 0 4px; font-size: 13px; }
    .detail .room-line { display: flex; align-items: center; gap: 6px; }
    .detail .room-line i {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1 id="title"></h1>
      <div class="controls">
        <button id="today" type="button"></button>
        <button id="prev" class="step" type="button">‹</button>
        <button id="next" class="step" type="button">›</button>
        <h2 id="range"></h2>
      </div>
      <div id="legend" class="legend"></div>
    </div>
    <p class="error" id="error" hidden></p>
  </header>
  <div id="calendar"></div>
  <div id="detail" class="detail" hidden></div>
  <script>
    const ru = document.documentElement.lang !== 'en';
    const locale = ru ? 'ru' : 'en-GB';
    const text = ru ? {
      title: 'Переговорные',
      today: 'Сегодня',
      prev: 'Предыдущая неделя',
      next: 'Следующая неделя',
      failed: 'Не удалось загрузить данные.',
    } : {
      title: 'Conference rooms',
      today: 'Today',
      prev: 'Previous week',
      next: 'Next week',
      failed: 'Could not load the data.',
    };
    const palette = [
      { bg: '#d2e3fc', fg: '#174ea6', edge: '#1a73e8' },
      { bg: '#ceead6', fg: '#0d652d', edge: '#188038' },
      { bg: '#feefc3', fg: '#7a4f01', edge: '#f9ab00' },
      { bg: '#fad2cf', fg: '#a50e0e', edge: '#d93025' },
    ];

    document.title = text.title;
    document.getElementById('title').textContent = text.title;
    document.getElementById('today').textContent = text.today;
    document.getElementById('prev').setAttribute('aria-label', text.prev);
    document.getElementById('next').setAttribute('aria-label', text.next);

    const calendar = document.getElementById('calendar');
    const detail = document.getElementById('detail');
    let board = null;
    let weekStart = null;
    let focusDate = null;
    let followNow = true;

    document.getElementById('today').addEventListener('click', () => {
      if (!board) return;
      weekStart = startOfWeek(board.today);
      followNow = true;
      render();
    });
    document.getElementById('prev').addEventListener('click', () => shiftWeek(-7));
    document.getElementById('next').addEventListener('click', () => shiftWeek(7));
    calendar.addEventListener('click', (event) => {
      if (event.target.closest('.event')) return;
      closeDetail();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeDetail();
    });

    function shiftWeek(days) {
      if (!weekStart) return;
      weekStart = addDays(weekStart, days);
      followNow = board && weekStart === startOfWeek(board.today);
      closeDetail();
      render();
    }

    function addDays(iso, days) {
      const [year, month, day] = iso.split('-').map(Number);
      const date = new Date(Date.UTC(year, month - 1, day));
      date.setUTCDate(date.getUTCDate() + days);
      return date.toISOString().slice(0, 10);
    }

    function startOfWeek(iso) {
      const [year, month, day] = iso.split('-').map(Number);
      const index = new Date(Date.UTC(year, month - 1, day)).getUTCDay();
      const mondayOffset = index === 0 ? -6 : 1 - index;
      return addDays(iso, mondayOffset);
    }

    function toMinutes(value) {
      const match = /^(\d{2}):(\d{2})$/.exec(value);
      if (!match) return null;
      return Number(match[1]) * 60 + Number(match[2]);
    }

    function utcDate(iso) {
      return new Date(`${iso}T00:00:00Z`);
    }

    function formatPart(iso, options) {
      return new Intl.DateTimeFormat(locale, { timeZone: 'UTC', ...options }).format(utcDate(iso));
    }

    function hourPx() {
      return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour')) || 72;
    }

    function phoneLayout() {
      return window.matchMedia('(max-width: 760px)').matches;
    }

    function weekLabel(start) {
      const end = addDays(start, 6);
      const sameMonth = start.slice(0, 7) === end.slice(0, 7);
      if (sameMonth) {
        const day = formatPart(start, { day: 'numeric' });
        const rest = formatPart(end, phoneLayout()
          ? { day: 'numeric', month: 'short' }
          : { day: 'numeric', month: 'long', year: 'numeric' });
        return `${day} – ${rest}`;
      }
      const left = formatPart(start, { day: 'numeric', month: 'short' });
      const right = formatPart(end, { day: 'numeric', month: 'short', year: 'numeric' });
      return `${left} – ${right}`;
    }

    function roomColor(roomId) {
      const index = Math.max(0, board.rooms.findIndex((room) => room.id === roomId));
      return palette[index % palette.length];
    }

    function placeEvents(events) {
      const items = events
        .map((event) => ({ ...event, startMin: toMinutes(event.start), endMin: toMinutes(event.end) }))
        .filter((event) => event.startMin != null && event.endMin != null && event.endMin > event.startMin)
        .sort((left, right) => left.startMin - right.startMin || left.endMin - right.endMin);
      const columns = [];
      items.forEach((event) => {
        let index = columns.findIndex((column) => column.every((other) => other.endMin <= event.startMin));
        if (index === -1) {
          index = columns.length;
          columns.push([]);
        }
        columns[index].push(event);
        event.column = index;
      });
      const parent = items.map((_, index) => index);
      const find = (index) => {
        while (parent[index] !== index) {
          parent[index] = parent[parent[index]];
          index = parent[index];
        }
        return index;
      };
      const union = (left, right) => { parent[find(left)] = find(right); };
      for (let left = 0; left < items.length; left += 1) {
        for (let right = left + 1; right < items.length; right += 1) {
          const a = items[left];
          const b = items[right];
          if (a.startMin < b.endMin && b.startMin < a.endMin) union(left, right);
        }
      }
      const groups = new Map();
      items.forEach((event, index) => {
        const root = find(index);
        if (!groups.has(root)) groups.set(root, []);
        groups.get(root).push(event);
      });
      groups.forEach((group) => {
        const count = Math.max(...group.map((event) => event.column)) + 1;
        group.forEach((event) => { event.columnCount = count; });
      });
      return items;
    }

    function renderLegend() {
      const legend = document.getElementById('legend');
      legend.replaceChildren();
      board.rooms.forEach((room) => {
        const color = roomColor(room.id);
        const item = document.createElement('span');
        item.className = 'swatch';
        const mark = document.createElement('i');
        mark.style.background = color.edge;
        const name = document.createElement('span');
        name.textContent = room.name;
        item.append(mark, name);
        legend.appendChild(item);
      });
    }

    function render() {
      if (!board || !weekStart) return;
      const scrollTop = calendar.scrollTop;
      const scrollLeft = calendar.scrollLeft;
      const open = board.openMinutes;
      const close = board.closeMinutes;
      const hourCount = (close - open) / 60;
      document.getElementById('range').textContent = weekLabel(weekStart);
      renderLegend();

      const phone = phoneLayout();
      const days = [];
      for (let offset = 0; offset < 7; offset += 1) days.push(addDays(weekStart, offset));
      if (phone && !days.includes(focusDate)) {
        focusDate = days.includes(board.today) ? board.today : days[0];
      }
      calendar.style.overflowX = phone ? 'hidden' : '';

      function makeColumn(date, localNow) {
        const column = document.createElement('div');
        column.className = 'day';
        for (let hour = 0; hour < hourCount; hour += 1) {
          column.appendChild(document.createElement('div')).className = 'slot';
        }
        placeEvents(active.filter((booking) => booking.date === date)).forEach((booking) => {
          const color = roomColor(booking.roomId);
          const block = document.createElement('button');
          block.type = 'button';
          block.className = 'event';
          if (booking.endMin - booking.startMin >= 60) block.classList.add('long');
          const title = booking.topic || booking.userName || booking.room;
          const when = `${booking.start}–${booking.end}`;
          const hour = hourPx();
          block.style.top = `${((booking.startMin - open) / 60) * hour + 1}px`;
          block.style.height = `${Math.max(((booking.endMin - booking.startMin) / 60) * hour - 3, 16)}px`;
          block.style.left = `calc(${(booking.column / booking.columnCount) * 100}% + 2px)`;
          block.style.width = `calc(${100 / booking.columnCount}% - 4px)`;
          block.style.background = color.bg;
          block.style.color = color.fg;
          block.style.borderLeftColor = color.edge;
          const heading = document.createElement('strong');
          heading.textContent = title;
          const time = document.createElement('span');
          time.textContent = when;
          block.append(heading, time);
          block.addEventListener('click', (event) => {
            event.stopPropagation();
            openDetail(block, booking, color);
          });
          column.appendChild(block);
        });
        if (localNow && date === board.today && board.nowMinutes >= open && board.nowMinutes <= close) {
          const line = document.createElement('div');
          line.className = 'now';
          line.style.top = `${((board.nowMinutes - open) / 60) * hourPx()}px`;
          line.style.left = '0';
          line.style.right = '0';
          column.appendChild(line);
        }
        return column;
      }

      const active = board.bookings.filter((booking) => booking.status !== 'cancelled');
      const gutter = document.createElement('div');
      gutter.className = 'gutter';
      for (let hour = 0; hour < hourCount; hour += 1) {
        const tick = document.createElement('div');
        tick.className = 'tick';
        const label = document.createElement('span');
        label.textContent = `${open / 60 + hour}:00`;
        tick.appendChild(label);
        if (hour === hourCount - 1) {
          const end = document.createElement('span');
          end.className = 'close-label';
          end.textContent = `${close / 60}:00`;
          tick.appendChild(end);
        }
        gutter.appendChild(tick);
      }

      if (phone) {
        const strip = document.createElement('div');
        strip.className = 'strip';
        const scroller = document.createElement('div');
        scroller.className = 'day-scroller';
        const track = document.createElement('div');
        track.className = 'day-track';
        days.forEach((date) => {
          const page = document.createElement('section');
          page.className = 'day-page';
          page.appendChild(makeColumn(date, true));
          track.appendChild(page);
        });
        scroller.appendChild(track);
        const boardRow = document.createElement('div');
        boardRow.className = 'phone-board';
        boardRow.append(gutter, scroller);
        const phoneSheet = document.createElement('div');
        phoneSheet.className = 'phone';
        phoneSheet.append(strip, boardRow);

        function markSelected() {
          strip.querySelectorAll('.chip').forEach((chip, index) => {
            chip.classList.toggle('selected', days[index] === focusDate);
          });
        }
        function scrollToDate(date, smooth) {
          const index = Math.max(0, days.indexOf(date));
          const width = scroller.clientWidth;
          scroller.querySelectorAll('.day-page').forEach((page) => {
            page.style.width = `${width}px`;
          });
          scroller.scrollTo({ left: index * width, behavior: smooth ? 'smooth' : 'auto' });
        }
        days.forEach((date) => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          if (date === board.today) chip.classList.add('today');
          if (date === focusDate) chip.classList.add('selected');
          const dow = document.createElement('span');
          dow.className = 'dow';
          dow.textContent = formatPart(date, { weekday: 'short' });
          const num = document.createElement('span');
          num.className = 'num';
          num.textContent = formatPart(date, { day: 'numeric' });
          chip.append(dow, num);
          chip.addEventListener('click', () => {
            focusDate = date;
            closeDetail();
            markSelected();
            scrollToDate(date, true);
          });
          strip.appendChild(chip);
        });
        scroller.addEventListener('scroll', () => {
          const width = scroller.clientWidth || 1;
          const index = Math.min(days.length - 1, Math.max(0, Math.round(scroller.scrollLeft / width)));
          const date = days[index];
          if (!date || date === focusDate) return;
          focusDate = date;
          markSelected();
        });
        calendar.replaceChildren(phoneSheet);
        requestAnimationFrame(() => {
          scrollToDate(focusDate, false);
          if (followNow) {
            const line = calendar.querySelector('.now');
            if (line) {
              const top = line.getBoundingClientRect().top - calendar.getBoundingClientRect().top;
              calendar.scrollTop = Math.max(0, calendar.scrollTop + top - calendar.clientHeight / 3);
            }
            followNow = false;
          } else {
            calendar.scrollTop = scrollTop;
          }
        });
        return;
      }

      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      const head = document.createElement('div');
      head.className = 'head';
      head.appendChild(document.createElement('div')).className = 'corner';
      days.forEach((date) => {
        const cell = document.createElement('div');
        cell.className = 'day-head';
        if (date === board.today) cell.classList.add('today');
        const dow = document.createElement('span');
        dow.className = 'dow';
        dow.textContent = formatPart(date, { weekday: 'short' });
        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = formatPart(date, { day: 'numeric' });
        cell.append(dow, num);
        head.appendChild(cell);
      });
      const body = document.createElement('div');
      body.className = 'body';
      body.appendChild(gutter);
      days.forEach((date) => body.appendChild(makeColumn(date, false)));
      if (days.includes(board.today) && board.nowMinutes >= open && board.nowMinutes <= close) {
        const line = document.createElement('div');
        line.className = 'now';
        line.style.top = `${((board.nowMinutes - open) / 60) * hourPx()}px`;
        body.appendChild(line);
      }
      sheet.append(head, body);
      calendar.replaceChildren(sheet);
      if (followNow) {
        const line = calendar.querySelector('.now');
        if (line) line.scrollIntoView({ block: 'center' });
        else calendar.scrollTop = 0;
        followNow = false;
      } else {
        calendar.scrollTop = scrollTop;
        calendar.scrollLeft = scrollLeft;
      }
    }

    function openDetail(block, booking, color) {
      calendar.querySelectorAll('.event.open').forEach((node) => node.classList.remove('open'));
      block.classList.add('open');
      const title = booking.topic || booking.userName || booking.room;
      detail.replaceChildren();
      const heading = document.createElement('h3');
      heading.textContent = title;
      const when = document.createElement('p');
      when.textContent = `${formatPart(booking.date, { weekday: 'long', day: 'numeric', month: 'long' })}, ${booking.start}–${booking.end}`;
      const room = document.createElement('p');
      room.className = 'room-line';
      const mark = document.createElement('i');
      mark.style.background = color.edge;
      const roomName = document.createElement('span');
      roomName.textContent = booking.room;
      room.append(mark, roomName);
      detail.append(heading, when, room);
      if (booking.topic && booking.userName) {
        const who = document.createElement('p');
        who.textContent = booking.userName;
        detail.appendChild(who);
      }
      detail.hidden = false;
      if (phoneLayout()) {
        detail.style.left = '12px';
        detail.style.right = '12px';
        detail.style.top = 'auto';
        detail.style.bottom = 'max(12px, env(safe-area-inset-bottom))';
        detail.style.width = 'auto';
        return;
      }
      detail.style.right = 'auto';
      detail.style.bottom = 'auto';
      detail.style.width = '';
      const rect = block.getBoundingClientRect();
      const width = Math.min(280, window.innerWidth - 24);
      let left = rect.left;
      if (left + width > window.innerWidth - 12) left = window.innerWidth - width - 12;
      let top = rect.bottom + 6;
      if (top + detail.offsetHeight > window.innerHeight - 12) top = Math.max(12, rect.top - detail.offsetHeight - 6);
      detail.style.left = `${Math.max(12, left)}px`;
      detail.style.top = `${top}px`;
    }

    function closeDetail() {
      detail.hidden = true;
      calendar.querySelectorAll('.event.open').forEach((node) => node.classList.remove('open'));
    }

    async function load() {
      const error = document.getElementById('error');
      try {
        const response = await fetch('/api/board', { cache: 'no-store' });
        if (!response.ok) throw new Error(text.failed);
        board = await response.json();
        if (!weekStart) {
          weekStart = startOfWeek(board.today);
          followNow = true;
        }
        error.hidden = true;
        render();
      } catch (loadError) {
        error.hidden = false;
        error.textContent = loadError.message || text.failed;
      }
    }

    let layoutMode = phoneLayout();
    let layoutWidth = window.innerWidth;
    window.addEventListener('resize', () => {
      const next = phoneLayout();
      const width = window.innerWidth;
      if (next === layoutMode && (!next || width === layoutWidth)) return;
      layoutMode = next;
      layoutWidth = width;
      closeDetail();
      render();
    });

    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
